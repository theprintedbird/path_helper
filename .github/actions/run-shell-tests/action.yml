name: 'Run Shell Tests'
description: 'Runs the shell-based test suite for path_helper'

inputs:
  language-version:
    description: 'Language version being tested (for reporting)'
    required: true
  executable:
    description: 'Absolute path of the path_helper executable to test (the `executable` output of setup-test-env)'
    required: false
    default: '/root/exe/path_helper'

outputs:
  test-result:
    description: 'Test result (passed/failed)'
    value: ${{ steps.run-tests.outcome }}

runs:
  using: 'composite'
  steps:
    - name: Run setup
      shell: bash
      env:
        PATH_HELPER_EXECUTABLE: ${{ inputs.executable }}
      run: |
        # sudo does not pass the environment through, so the executable is named
        # inside the command rather than exported around it. PATH is carried in
        # the same way: sudo resets it to secure_path, which does not contain the
        # tool-cache Ruby that `#!/usr/bin/env ruby` needs.
        sudo bash -c "cd /root && PATH=\"$PATH\" '$PATH_HELPER_EXECUTABLE' --setup --no-lib --quiet"
        sudo cp -R spec/fixtures/moredirs/* /root/.config/paths
        # Populate /etc/paths if it's empty and the source file exists
        if [ ! -s /etc/paths ] && [ -f docker/assets/etc-paths ]; then
          sudo cp docker/assets/etc-paths /etc/paths
        fi
    - name: Run tests
      id: run-tests
      shell: bash
      env:
        PATH_HELPER_DOCKER_INSTANCE: '1'
        PATH_HELPER_EXECUTABLE: ${{ inputs.executable }}
      run: |
        set -o pipefail
        sudo bash -c "cd /root && PATH=\"$PATH\" PATH_HELPER_DOCKER_INSTANCE=1 PATH_HELPER_EXECUTABLE='$PATH_HELPER_EXECUTABLE' ./spec/shell_spec.sh" 2>&1 | tee test_output.log

    - name: Display test failures
      if: failure()
      shell: bash
      run: |
        echo "========================================"
        echo "TEST FAILURES - ${{ inputs.language-version }}"
        echo "========================================"
        if [ -f test_output.log ]; then
          echo ""
          echo "Failed tests:"
          # The suite reports in TAP 14, so a failure is a "not ok" test point.
          # Print each one with the diagnostics that follow it, up to the next
          # test point.
          awk '/^not ok /{show=1} /^(ok|1\.\.)/{show=0} show' test_output.log \
            || cat test_output.log
          echo ""
          echo "========================================"
        fi

    - name: Generate test summary
      if: always()
      shell: bash
      run: |
        echo "## Test Results for ${{ inputs.language-version }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f test_output.log ]; then
          # TAP 14: count the test points rather than looking for a summary
          # line, so the counts stay right however many tests the suite grows.
          passed=$(grep -c '^ok ' test_output.log || true)
          failed=$(grep -c '^not ok ' test_output.log || true)
          if grep -q '^1\.\.0 # SKIP' test_output.log; then
            echo ":fast_forward: **Suite skipped** - see the output below" >> $GITHUB_STEP_SUMMARY
          elif [ "$failed" -eq 0 ] && [ "$passed" -gt 0 ]; then
            echo ":white_check_mark: **All $passed tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo ":x: **$failed of $((passed + failed)) tests failed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### TAP output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        else
          echo ":warning: **No test output found**" >> $GITHUB_STEP_SUMMARY
        fi

