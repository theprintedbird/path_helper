name: 'Run Shell Tests'
description: 'Runs the shell-based test suite for path_helper'

# Like setup-test-env, this has to run both as a sudo-capable user on a hosted
# runner and as root in a container job without sudo or bash, so every step is
# POSIX sh.

inputs:
  language-version:
    description: 'Language version being tested (for reporting)'
    required: true
  executable:
    description: 'Absolute path of the path_helper executable to test (the `executable` output of setup-test-env)'
    required: true
  home:
    description: 'Home directory to run the suite in (the `home` output of setup-test-env)'
    required: true
  coverage:
    description: >-
      Measure line coverage of the implementation under test while the suite
      runs: `ruby` or `crystal` (see spec/lib/coverage/run.sh). Empty, the
      default, runs the suite plainly. The report goes to the `coverage-dir`
      output and its summary to the job summary. It never fails the step on
      its own account: the step's status is the suite's.
    required: false
    default: ''

outputs:
  test-result:
    description: 'Test result (passed/failed)'
    value: ${{ steps.run-tests.outcome }}
  coverage-dir:
    description: 'Where the coverage report was written, when `coverage` was set'
    value: ${{ steps.run-tests.outputs.coverage-dir }}

runs:
  using: 'composite'
  steps:
    # Cheap, non-destructive: catches a GNU-only shell form (sed -i, stat,
    # readlink, date +%N, ...) landing in the harness before it reaches a
    # macOS runner and fails there instead. Kept to this one place so both
    # test-ruby.yml and test-crystal.yml get it without duplicating the step.
    - name: Lint the harness for GNU-only shell
      shell: sh
      run: sh spec/lint_portability.sh

    # The suite does its own --setup and copies its own fixtures after clearing
    # out any earlier run, so there is nothing to prepare beyond setup-test-env.
    - name: Run tests
      id: run-tests
      shell: sh
      env:
        EXECUTABLE: ${{ inputs.executable }}
        TEST_HOME: ${{ inputs.home }}
        COVERAGE: ${{ inputs.coverage }}
      run: |
        as_root=""
        [ "$(id -u)" -eq 0 ] || as_root=sudo

        # With coverage on, spec/lib/coverage/run.sh runs the suite instead,
        # writing its report into the workspace for the upload step. For
        # Crystal it builds its own debug binary from the checked-out sources.
        coverage_dir=""
        if [ -n "$COVERAGE" ]; then
          coverage_dir="$GITHUB_WORKSPACE/coverage/$COVERAGE"
          echo "coverage-dir=$coverage_dir" >> "$GITHUB_OUTPUT"
        fi

        # sudo resets the environment, so what the suite needs is handed over
        # through env(1) rather than exported. That includes PATH, since sudo's
        # secure_path does not contain the tool-cache Ruby that
        # `#!/usr/bin/env ruby` needs, and HOME, which in a container job is
        # /github/home rather than root's.
        # sh has no pipefail, so the suite's status is kept in a file to survive
        # the pipe into tee. `&& ... ||` rather than a bare command, because
        # `sh -e` would otherwise stop the group before the status is written.
        status_file="$RUNNER_TEMP/shell-tests-status"
        {
          $as_root env HOME="$TEST_HOME" PATH="$PATH" \
            PATH_HELPER_DOCKER_INSTANCE=1 PATH_HELPER_EXECUTABLE="$EXECUTABLE" \
            COVERAGE="$COVERAGE" COVERAGE_DIR="$coverage_dir" \
            PATH_HELPER_COVERAGE_SRC="$GITHUB_WORKSPACE" \
            sh -c 'cd "$HOME" && if [ -n "$COVERAGE" ]; then
                exec sh ./spec/lib/coverage/run.sh "$COVERAGE" "$COVERAGE_DIR"
              else
                exec ./spec/shell_spec.sh
              fi' 2>&1 \
            && status=0 || status=$?
          echo "$status" > "$status_file"
        } | tee test_output.log
        exit "$(cat "$status_file")"

    - name: Display test failures
      if: failure()
      shell: sh
      env:
        LANGUAGE_VERSION: ${{ inputs.language-version }}
      run: |
        echo "========================================"
        echo "TEST FAILURES - $LANGUAGE_VERSION"
        echo "========================================"
        if [ -f test_output.log ]; then
          echo ""
          echo "Failed tests:"
          # The suite reports in TAP 14, so a failure is a "not ok" test point.
          # Print each one with the diagnostics that follow it, up to the next
          # test point.
          awk '/^not ok /{show=1} /^(ok|1\.\.)/{show=0} show' test_output.log \
            || cat test_output.log
          echo ""
          echo "========================================"
        fi

    # Informational only: there is no threshold, so low coverage never fails
    # the job.
    - name: Add the coverage summary
      if: always() && inputs.coverage != ''
      shell: sh
      env:
        COVERAGE_DIR: ${{ steps.run-tests.outputs.coverage-dir }}
      run: |
        if [ -f "$COVERAGE_DIR/summary.md" ]; then
          cat "$COVERAGE_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo ":warning: **No coverage report was made** - see the test output" >> "$GITHUB_STEP_SUMMARY"
        fi
        echo "" >> "$GITHUB_STEP_SUMMARY"

    - name: Generate test summary
      if: always()
      shell: sh
      env:
        LANGUAGE_VERSION: ${{ inputs.language-version }}
      run: |
        echo "## Test Results for $LANGUAGE_VERSION" >> "$GITHUB_STEP_SUMMARY"
        echo "" >> "$GITHUB_STEP_SUMMARY"
        if [ -f test_output.log ]; then
          # TAP 14: count the test points rather than looking for a summary
          # line, so the counts stay right however many tests the suite grows.
          passed=$(grep -c '^ok ' test_output.log || true)
          failed=$(grep -c '^not ok ' test_output.log || true)
          if grep -q '^1\.\.0 # SKIP' test_output.log; then
            echo ":fast_forward: **Suite skipped** - see the output below" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$failed" -eq 0 ] && [ "$passed" -gt 0 ]; then
            echo ":white_check_mark: **All $passed tests passed**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":x: **$failed of $((passed + failed)) tests failed**" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### TAP output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat test_output.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        else
          echo ":warning: **No test output found**" >> "$GITHUB_STEP_SUMMARY"
        fi
