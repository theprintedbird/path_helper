name: Lint

on:
  push:
    branches:
      - master
      - dev
    paths: &paths
      - '.github/**'
      - 'spec/**/*.sh'
      - 'docker/*.sh'
      - '.shellcheckrc'
      # `make shellcheck` is the shellcheck job's file list, kept in step here.
      - 'Makefile'
  pull_request:
    branches:
      - master
      - dev
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Tool versions are pinned so CI lints with what `make check` does on the host
  # (the Makefile records the same versions and warns when the host differs --
  # change them together). ACTIONLINT_VERSION is in the actionlint job and
  # zizmor's `version:` in the zizmor job.
  SHELLCHECK_VERSION: '0.11.0'
  # linux.x86_64 .tar.xz digest, as published for the asset on the release at
  # https://github.com/koalaman/shellcheck/releases/tag/v0.11.0 (shellcheck
  # ships no checksum file) -- verified below rather than trusted from the
  # runner's preinstalled copy, whose version drifts (ubuntu-latest's flagged
  # SC2015 where 0.11.0 doesn't).
  SHELLCHECK_SHA256: '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198'

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: '1.7.12'
      # linux_amd64 checksum from actionlint_1.7.12_checksums.txt, published
      # alongside the release at
      # https://github.com/rhysd/actionlint/releases/tag/v1.7.12 -- verified
      # below rather than trusted from a script piped over the network.
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download shellcheck
      run: |
        curl -sSL -o "${RUNNER_TEMP}/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"

    - name: Verify shellcheck checksum
      run: |
        echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum -c -

    - name: Install shellcheck
      run: |
        mkdir -p "${RUNNER_TEMP}/bin"
        tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}/bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
        echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/bin/shellcheck" --version

    - name: Download actionlint
      run: |
        curl -sSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

    - name: Verify checksum
      run: |
        echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -

    - name: Install actionlint
      run: |
        tar -xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
        chmod +x actionlint
        ./actionlint -version

    - name: Run actionlint
      # Lints the workflows under .github/workflows/ (its own shellcheck check of
      # their run: scripts uses the pinned shellcheck installed above); composite
      # actions under .github/actions/ are checked only as far as they're
      # referenced from a workflow, which covers both of this project's.
      run: ./actionlint -color

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Download shellcheck
      run: |
        curl -sSL -o "${RUNNER_TEMP}/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"

    - name: Verify shellcheck checksum
      run: |
        echo "${SHELLCHECK_SHA256}  ${RUNNER_TEMP}/shellcheck.tar.xz" | sha256sum -c -

    - name: Install shellcheck
      run: |
        mkdir -p "${RUNNER_TEMP}/bin"
        tar -xJf "${RUNNER_TEMP}/shellcheck.tar.xz" -C "${RUNNER_TEMP}/bin" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
        echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
        "${RUNNER_TEMP}/bin/shellcheck" --version

    - name: Run shellcheck
      # The same find as `make shellcheck` (config: .shellcheckrc) -- keep them
      # in step. Not `make` itself: the Makefile errors at parse time unless
      # podman or docker is on PATH, which this job has no need of.
      run: find spec docker -name '*.sh' -type f -exec shellcheck {} +

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Run zizmor
      uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
      with:
        # An exact version (the action's default is `latest`, which picked up
        # new audits such as 1.30's self-repository unannounced).
        version: '1.30.1'
        # Print findings in the log and fail the job, rather than uploading
        # SARIF to code scanning (which would need security-events: write).
        advanced-security: false
