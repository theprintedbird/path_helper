name: Release Crystal Binary

on:
  # Trigger on version tags (e.g., v4.0.0, v4.1.0)
  push:
    tags:
      - 'v*.*.*'

  # Allow manual triggering
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v4.0.0)'
        required: true
        type: string

# Read-only by default; only the release job, which creates the release and
# uploads its assets, gets write access.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux-x86_64
            runner: ubuntu-latest
            crystal: latest
            artifact_name: path_helper-linux-x86_64
            build_flags: --static
          - os: macos-x86_64
            runner: macos-15-intel
            crystal: latest
            artifact_name: path_helper-macos-x86_64
            build_flags: ""
          - os: macos-arm64
            runner: macos-14
            crystal: latest
            artifact_name: path_helper-macos-arm64
            build_flags: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Crystal
        uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
        with:
          crystal: ${{ matrix.crystal }}

      - name: Install dependencies
        run: shards install --production

      - name: Build release binary
        env:
          BUILD_FLAGS: ${{ matrix.build_flags }}
        run: |
          # Unquoted on purpose: empty, or one or more flags to split.
          # shellcheck disable=SC2086
          shards build --release --no-debug $BUILD_FLAGS
          chmod +x bin/path_helper

      - name: Verify binary
        run: |
          ./bin/path_helper --version
          file bin/path_helper

      - name: Create tarball and checksum
        env:
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        run: |
          tar -czf "$ARTIFACT_NAME.tar.gz" -C bin path_helper
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256"
          else
            sha256sum "$ARTIFACT_NAME.tar.gz" > "$ARTIFACT_NAME.tar.gz.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.tar.gz.sha256
          retention-days: 5

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release and upload its assets

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          ls -lah release-assets/

      - name: Extract version from tag
        id: version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            TAG=${GITHUB_REF#refs/tags/}
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG: ${{ inputs.tag_name }}

      - name: Generate release notes
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        # The heading is printed separately so the here-document can stay
        # quoted: unquoted, its backticks would be command substitutions.
        run: |
          {
          printf '# path_helper %s\n' "$VERSION"
          cat << 'EOF'

          ## Pre-built Binaries

          Download the appropriate binary for your platform:

          - **Linux (x86_64)**: `path_helper-linux-x86_64.tar.gz`
          - **macOS (Intel)**: `path_helper-macos-x86_64.tar.gz`
          - **macOS (Apple Silicon)**: `path_helper-macos-arm64.tar.gz`

          ### Installation

          ```bash
          # Download and extract (example for Linux)
          tar -xzf path_helper-linux-x86_64.tar.gz

          # Verify checksum
          sha256sum -c path_helper-linux-x86_64.tar.gz.sha256

          # Install (requires sudo)
          sudo mv path_helper /usr/local/bin/
          sudo chmod +x /usr/local/bin/path_helper
          ```

          ### Verification

          ```bash
          path_helper --version
          ```

          ## Changes

          See [CHANGES.md](CHANGES.md) for details.
          EOF
          } > release_notes.md

      - name: Create Release
        # The runner's own gh, so no third-party action holds the write token.
        # A release that already exists (a re-run, or one made by hand) has its
        # assets replaced and is then retitled, given these notes and published,
        # as softprops/action-gh-release did; otherwise it is created, published
        # (not a draft or prerelease).
        # --target only matters when the tag doesn't exist yet (a manual run,
        # or a draft left without one): the tag is then made at the commit that
        # was built, not the default branch's head. GitHub ignores it otherwise.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "Release $TAG" --notes-file release_notes.md \
              --draft=false --prerelease=false --target "$GITHUB_SHA"
          else
            gh release create "$TAG" release-assets/* --title "Release $TAG" \
              --notes-file release_notes.md --target "$GITHUB_SHA"
          fi
