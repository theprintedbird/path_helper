name: Crystal Implementation Tests

# Only when something the Crystal run reads has changed: the sources and
# shard files, the suite (spec/, which also holds its fixtures and the coverage
# helpers), the /etc/paths setup-test-env installs, the kcov install script,
# the composite actions and this file. The list is a YAML anchor so push and
# pull_request can't drift apart. No branch has required checks, so a skipped
# run can't leave one pending (if one is ever added, it will);
# workflow_dispatch runs regardless.
on:
  push:
    branches:
      - master
      - dev
      - 'claude/path-helper-crystal-*'
    paths: &crystal-paths
      - 'src/**'
      - 'shard.yml'
      - 'shard.lock'
      - 'spec/**'
      - 'docker/assets/**'
      - 'docker/install-kcov.sh'
      - '.github/actions/**'
      - '.github/workflows/test-crystal.yml'
  pull_request:
    branches:
      - master
      - dev
    paths: *crystal-paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-crystal:
    runs-on: ${{ matrix.os }}
    # macOS is the only place the Darwin fixtures can be checked: the default
    # search order comes from the platform (the compile target) and can't be
    # overridden.
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, ubuntu-latest x86_64.
        os: ['ubuntu-latest', 'macos-latest']
        # Test multiple Crystal versions
        crystal-version: ['1.10.1', '1.16.0', 'latest']

    steps:
    - uses: actions/checkout@v7

    - name: Install Crystal ${{ matrix.crystal-version }}
      uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
      with:
        crystal: ${{ matrix.crystal-version }}

    - name: Install shards dependencies
      run: shards install

    # The compiler's own cache (CRYSTAL_CACHE_DIR), not the binary: every
    # build still parses, type-checks, generates the LLVM IR and links against
    # the runner's libraries in full, and reuses the cached object file only
    # when the IR it has just generated is byte-identical to what produced it.
    # That skips LLVM's --release optimisation, most of the build time, when
    # nothing that affects the output has changed; anything else is a normal
    # full build. A --release build is a single LLVM module, so an older
    # entry can never be partly reused, hence an exact key and no
    # restore-keys. The key is the full `crystal --version` (so "latest", and
    # glibc/musl/darwin targets, each get their own) and the sources.
    # Never used by release.yml, whose binaries are always built cold.
    - name: Locate the Crystal compiler cache
      id: crystal-cache
      run: |
        echo "dir=$(crystal env CRYSTAL_CACHE_DIR)" >> "$GITHUB_OUTPUT"
        echo "compiler=$(crystal --version | cksum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Restore the Crystal compiler cache
      id: crystal-cache-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.crystal-cache.outputs.dir }}
        key: crystal-${{ runner.os }}-${{ runner.arch }}-${{ steps.crystal-cache.outputs.compiler }}-${{ hashFiles('src/**', 'shard.yml') }}

    - name: Build Crystal executable
      run: |
        shards build --release --no-debug
        ls -la bin/

    # Straight after the build rather than at the end of the job, so a test
    # failure doesn't also throw away a good build's cache.
    - name: Save the Crystal compiler cache
      if: steps.crystal-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.crystal-cache.outputs.dir }}
        key: ${{ steps.crystal-cache-restore.outputs.cache-primary-key }}

    - name: Set up test environment
      id: setup-test-env
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'bin/path_helper'

    - name: Run shell tests
      uses: ./.github/actions/run-shell-tests
      with:
        executable: ${{ steps.setup-test-env.outputs.executable }}
        home: ${{ steps.setup-test-env.outputs.home }}
        language-version: 'Crystal ${{ matrix.crystal-version }} on ${{ matrix.os }}'

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-crystal-${{ matrix.crystal-version }}-${{ matrix.os }}
        path: test_output.log
        retention-days: 7

    - name: Run Crystal specs (if available)
      if: hashFiles('spec/*_spec.cr') != ''
      run: crystal spec

  # test-crystal builds against glibc (ubuntu-latest) and macOS's libc; this
  # builds against musl, in the image the local `make test-crystal` uses.
  # crystal-lang/install-crystal has no Alpine support, hence the container.
  # The job is already root and there is no bash, which the composite actions
  # allow for. The runner supplies a musl node for the JavaScript actions, on
  # x86_64 only.
  test-crystal-alpine:
    runs-on: ubuntu-latest
    container: crystallang/crystal:${{ matrix.crystal-version }}-alpine
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'
    strategy:
      fail-fast: false
      matrix:
        crystal-version: ['1.10.1', '1.16.0', 'latest']

    steps:
    - uses: actions/checkout@v7

    # The suite's timing helper shells out to ruby. actions/cache needs GNU
    # tar: busybox's refuses its --posix.
    - name: Install Ruby and GNU tar
      run: apk add --no-cache ruby tar

    - name: Install shards dependencies
      run: shards install

    # See test-crystal for what is cached and why it is safe to.
    - name: Locate the Crystal compiler cache
      id: crystal-cache
      run: |
        echo "dir=$(crystal env CRYSTAL_CACHE_DIR)" >> "$GITHUB_OUTPUT"
        echo "compiler=$(crystal --version | cksum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Restore the Crystal compiler cache
      id: crystal-cache-restore
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.crystal-cache.outputs.dir }}
        key: crystal-${{ runner.os }}-${{ runner.arch }}-${{ steps.crystal-cache.outputs.compiler }}-${{ hashFiles('src/**', 'shard.yml') }}

    - name: Build Crystal executable
      run: |
        shards build --release --no-debug
        ls -la bin/

    - name: Save the Crystal compiler cache
      if: steps.crystal-cache-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.crystal-cache.outputs.dir }}
        key: ${{ steps.crystal-cache-restore.outputs.cache-primary-key }}

    - name: Set up test environment
      id: setup-test-env
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'bin/path_helper'

    - name: Run shell tests
      uses: ./.github/actions/run-shell-tests
      with:
        executable: ${{ steps.setup-test-env.outputs.executable }}
        home: ${{ steps.setup-test-env.outputs.home }}
        language-version: 'Crystal ${{ matrix.crystal-version }} on alpine'

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-results-crystal-${{ matrix.crystal-version }}-alpine
        path: test_output.log
        retention-days: 7

    - name: Run Crystal specs (if available)
      if: hashFiles('spec/*_spec.cr') != ''
      run: crystal spec

  # Line coverage of the Crystal sources as the suite exercises them, on one
  # Crystal rather than the whole matrix (spec/lib/coverage/run.sh; `make
  # coverage-crystal` locally). kcov does the measuring; nothing packages it
  # for Ubuntu 24.04, so it is built from source -- but cached across runs
  # (below), since the build itself takes 1-2 minutes. A report, not a gate:
  # the job fails only if the suite does, and the summary goes to the job
  # summary with the full report (kcov's HTML, Cobertura XML) as an artifact.
  coverage-crystal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'
      # The single place the kcov version is set, so the cache key
      # (KCOV_VERSION below) and the build (passed as install-kcov.sh's
      # argument) can't drift apart.
      KCOV_VERSION: 'v43'
      # Under $HOME rather than /usr/local so it can be restored without
      # root: actions/cache runs as the job user, and install-kcov.sh only
      # sudos `make install` when the prefix isn't writable by that user.
      KCOV_PREFIX: '/home/runner/.local/kcov'

    steps:
    - uses: actions/checkout@v7

    - name: Install Crystal latest
      uses: crystal-lang/install-crystal@d8ef131ecec0352ce0e39b81b0a6d95def58fe2f # v1.9.2
      with:
        crystal: 'latest'

    # Keyed on the kcov version, the runner's OS/arch and Ubuntu release
    # (ImageOS: the ABI of the libraries kcov links against) and the install
    # script itself, so a change to any of those rebuilds rather than restoring
    # a stale or mismatched binary.
    - name: Cache kcov
      uses: actions/cache@v6
      with:
        path: ${{ env.KCOV_PREFIX }}
        key: kcov-${{ env.KCOV_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ env.ImageOS }}-${{ hashFiles('docker/install-kcov.sh') }}

    # A no-op on a cache hit whose kcov already runs on this image. Otherwise
    # install-kcov.sh installs kcov's runtime libraries, and only rebuilds if
    # $KCOV_PREFIX/bin/kcov is missing or still won't run.
    - name: Install kcov
      run: sh docker/install-kcov.sh "$KCOV_VERSION"

    - name: Add kcov to PATH
      run: echo "$KCOV_PREFIX/bin" >> "$GITHUB_PATH"

    - name: Install shards dependencies
      run: shards install

    # The same key as test-crystal's ubuntu-latest/latest build, which is
    # the one that saves it (see there for why the cache is safe): this job
    # only reads it. A --debug build has nothing to reuse, so the coverage
    # run's own build gets nothing from it.
    - name: Locate the Crystal compiler cache
      id: crystal-cache
      run: |
        echo "dir=$(crystal env CRYSTAL_CACHE_DIR)" >> "$GITHUB_OUTPUT"
        echo "compiler=$(crystal --version | cksum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

    - name: Restore the Crystal compiler cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.crystal-cache.outputs.dir }}
        key: crystal-${{ runner.os }}-${{ runner.arch }}-${{ steps.crystal-cache.outputs.compiler }}-${{ hashFiles('src/**', 'shard.yml') }}

    # Only so setup-test-env has an executable to install: the coverage run
    # builds and measures its own debug binary from the checked-out sources.
    - name: Build Crystal executable
      run: shards build --release --no-debug

    - name: Set up test environment
      id: setup-test-env
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'bin/path_helper'

    - name: Run shell tests with coverage
      id: run-shell-tests
      uses: ./.github/actions/run-shell-tests
      with:
        executable: ${{ steps.setup-test-env.outputs.executable }}
        home: ${{ steps.setup-test-env.outputs.home }}
        language-version: 'Crystal latest on ubuntu-latest, with coverage'
        coverage: 'crystal'

    - name: Upload coverage report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-crystal
        path: ${{ steps.run-shell-tests.outputs.coverage-dir }}
        if-no-files-found: warn
        retention-days: 14
