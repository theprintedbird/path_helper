name: Ruby Implementation Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ruby:
    runs-on: ${{ matrix.os }}
    # macOS is the only place the Darwin fixtures can be checked: the default
    # search order comes from the platform (RUBY_PLATFORM) and can't be
    # overridden. Until spec/fixtures has Darwin results, the expected output is
    # Linux's, so the macOS leg is reported but doesn't fail the workflow.
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, ubuntu-latest x86_64.
        os: ['ubuntu-latest', 'macos-latest']
        # Test key Ruby versions: last 2.x (2.7), modern stable (3.3), latest (4+)
        ruby-version: ['2.7', '3.3', '4.0.6']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}

    - name: Set up test environment
      id: setup-test-env
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'exe/path_helper'

    - name: Run shell tests
      uses: ./.github/actions/run-shell-tests
      with:
        executable: ${{ steps.setup-test-env.outputs.executable }}
        home: ${{ steps.setup-test-env.outputs.home }}
        language-version: 'Ruby ${{ matrix.ruby-version }} on ${{ matrix.os }}'

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-ruby-${{ matrix.ruby-version }}-${{ matrix.os }}
        path: test_output.log
        retention-days: 7
