name: Ruby Implementation Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-ruby:
    runs-on: ${{ matrix.os }}
    # macOS is the only place the Darwin fixtures can be checked: the default
    # search order comes from the platform (RUBY_PLATFORM) and can't be
    # overridden.
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is arm64, ubuntu-latest x86_64.
        os: ['ubuntu-latest', 'macos-latest']
        # Test key Ruby versions: last 2.x (2.7), modern stable (3.3), latest (4+)
        ruby-version: ['2.7', '3.3', '4.0.6']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}

    - name: Set up test environment
      id: setup-test-env
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'exe/path_helper'

    - name: Run shell tests
      uses: ./.github/actions/run-shell-tests
      with:
        executable: ${{ steps.setup-test-env.outputs.executable }}
        home: ${{ steps.setup-test-env.outputs.home }}
        language-version: 'Ruby ${{ matrix.ruby-version }} on ${{ matrix.os }}'

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-ruby-${{ matrix.ruby-version }}-${{ matrix.os }}
        path: test_output.log
        retention-days: 7

  # Real coverage for the macOS system Ruby (/usr/bin/ruby, deprecated by
  # Apple since Catalina but still what a shell profile finds before any
  # version manager has put a newer Ruby on PATH -- see CLAUDE.md and
  # README's "Do i need to be on Apple to use it?"). Deliberately does not
  # use ruby/setup-ruby: the point is to exercise the exact interpreter a
  # real user's ~/.zprofile would invoke via `#!/usr/bin/env ruby`.
  test-ruby-macos-system:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Verify macOS system Ruby is present
      run: |
        if [ ! -x /usr/bin/ruby ]; then
          echo "::error::/usr/bin/ruby is missing on this runner image -- Apple has removed the" >&2
          echo "::error::deprecated system Ruby. Update CLAUDE.md/README's minimum Ruby version and" >&2
          echo "::error::remove or rework this job." >&2
          exit 1
        fi
        /usr/bin/ruby -v

    - name: Put /usr/bin first on PATH
      # Makes sure exe/path_helper's `#!/usr/bin/env ruby` shebang resolves to
      # the system Ruby rather than any toolcache Ruby also on this runner.
      run: echo "/usr/bin" >> "$GITHUB_PATH"

    - name: Set up test environment
      id: setup-test-env
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'exe/path_helper'

    - name: Run shell tests
      uses: ./.github/actions/run-shell-tests
      with:
        executable: ${{ steps.setup-test-env.outputs.executable }}
        home: ${{ steps.setup-test-env.outputs.home }}
        language-version: 'Ruby (macOS system /usr/bin/ruby) on macos-latest'

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-ruby-macos-system
        path: test_output.log
        retention-days: 7

  # The local images are Alpine -- musl, busybox sh and no bash -- so this runs
  # the suite that way in CI too. ruby/setup-ruby has no Alpine builds, so the
  # Ruby comes from the official image, and the job is already root. The runner
  # supplies a musl node for the JavaScript actions, on x86_64 only.
  test-ruby-alpine:
    runs-on: ubuntu-latest
    container: ruby:${{ matrix.ruby-version }}-alpine
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['2.7', '3.3', '4.0.6']

    steps:
    - uses: actions/checkout@v4

    - name: Set up test environment
      id: setup-test-env
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'exe/path_helper'

    - name: Run shell tests
      uses: ./.github/actions/run-shell-tests
      with:
        executable: ${{ steps.setup-test-env.outputs.executable }}
        home: ${{ steps.setup-test-env.outputs.home }}
        language-version: 'Ruby ${{ matrix.ruby-version }} on alpine'

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-ruby-${{ matrix.ruby-version }}-alpine
        path: test_output.log
        retention-days: 7

  # Line coverage of exe/path_helper as the suite exercises it, on one Ruby
  # rather than the whole matrix (spec/lib/coverage/run.sh; `make coverage`
  # locally). A report, not a gate: the job fails only if the suite does, and
  # the summary goes to the job summary with the full report as an artifact.
  coverage-ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby 3.3
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'

    - name: Set up test environment
      id: setup-test-env
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'exe/path_helper'

    - name: Run shell tests with coverage
      id: run-shell-tests
      uses: ./.github/actions/run-shell-tests
      with:
        executable: ${{ steps.setup-test-env.outputs.executable }}
        home: ${{ steps.setup-test-env.outputs.home }}
        language-version: 'Ruby 3.3 on ubuntu-latest, with coverage'
        coverage: 'ruby'

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-ruby
        path: ${{ steps.run-shell-tests.outputs.coverage-dir }}
        # .resultset.json (SimpleCov's format) is a dotfile.
        include-hidden-files: true
        if-no-files-found: warn
        retention-days: 14
