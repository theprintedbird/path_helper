name: Path Helper Tests

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PATH_HELPER_DOCKER_INSTANCE: 'true'
    strategy:
      fail-fast: false
      matrix:
        # Test key Ruby versions: last 2.x (2.7), modern stable (3.3), latest (4+)
        ruby-version: ['2.7', '3.3', '4.0.6']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Ruby ${{ matrix.ruby-version }}
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby-version }}

    - name: Set up test environment
      uses: ./.github/actions/setup-test-env
      with:
        exe-path: 'exe/path_helper'

    - name: Run shell tests
      uses: ./.github/actions/run-shell-tests
      with:
        language-version: 'Ruby ${{ matrix.ruby-version }}'

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-ruby-${{ matrix.ruby-version }}
        path: test_output.log
        retention-days: 7
